
name: Banking Data Engineering CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/github-actions-cicd

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Confirm validation completed
        run: echo "Repository validation completed"
